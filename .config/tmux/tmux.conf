# set -g escape-time 0
# unbind -n MouseDown3Pane

set -g mouse on
set -g base-index 1

set-window-option -g mode-keys vi

unbind M-Left; unbind M-Right; unbind M-Up; unbind M-Down;
bind -n M-Left select-pane -L 
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

unbind k; unbind j; unbind h; unbind L;
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

unbind J; unbind K; unbind L; unbind H;
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -L 10
bind -r H resize-pane -R 10

unbind r; unbind C-g;
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message ".tmux.conf reloaded."
bind-key C-g display-popup -E -d "#{pane_current_path}" -w 80% -h 80% -xC -yC "lazygit"

set -g default-terminal "${TERM}"
set-option -sa terminal-overrides ",*:RGB"

# Styling
source $HOME/.config/tmux/theme.conf
#set -g status-bg '#2d3748'
#set -g status-fg 'white'

# Plugins
#set -g @plugin 'tmux-plugins/tmux-sensible'
#run '~/.tmux/plugins/tpm/tpm'
